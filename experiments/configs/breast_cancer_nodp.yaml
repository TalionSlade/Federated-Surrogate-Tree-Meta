# Utility-ceiling baseline — no DP. Same as breast_cancer_dp_laplace.yaml minus the noise.
name: breast_cancer_nodp
output_dir: experiments/results/breast_cancer_nodp
n_rounds: 5
random_state: 42

data:
  name: breast_cancer
  test_fraction: 0.2
  random_state: 0

partition:
  strategy: dirichlet
  n_clients: 10
  alpha: 0.5
  seed: 0

proxy:
  source: external
  n_samples: 200
  seed: 0

model:
  teacher_framework: sklearn_rf
  teacher_kwargs:
    n_estimators: 100
    max_depth: 12
    min_samples_leaf: 2
  student_framework: sklearn_dt
  student_kwargs:
    max_depth: 5
    min_samples_leaf: 3

distillation:
  mode: argmax_weighted
  temperature: 1.0
  floor: 0.0

dp:
  mechanism: "null"          # NullDPMechanism — utility-ceiling baseline (quoted so YAML keeps the string)
  target_epsilon: 100.0
  target_delta: 1.0e-5
  accountant: basic
  seed: 0

aggregator:
  strategy: proxy_redistillation
  student_framework: sklearn_dt
  student_kwargs:
    max_depth: 5

meta:
  enabled: true
  strategy: stacking
  standardise_proba_cols: false
