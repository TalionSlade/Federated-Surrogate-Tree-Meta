[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedrf-distill"
version = "0.1.0"
description = "Privacy-preserving cross-framework federated distillation for tree ensembles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FedRF-Distill Authors" }]
keywords = [
    "federated-learning",
    "differential-privacy",
    "knowledge-distillation",
    "random-forest",
    "tree-ensembles",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pydantic>=2.5",
    "typing-extensions>=4.8",
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
lightgbm = ["lightgbm>=4.0"]
catboost = ["catboost>=1.2"]
all-models = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2"]
datasets = ["openml>=0.14", "ucimlrepo>=0.0.7", "kaggle>=1.6"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "hypothesis>=6.90",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.5",
]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0", "myst-parser>=2.0"]

[project.scripts]
fedrf-experiment = "fedrf_distill.cli:run_experiment"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "PTH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers --cov=fedrf_distill --cov-report=term-missing"

[tool.coverage.run]
source = ["src/fedrf_distill"]
omit = ["*/tests/*", "*/__init__.py"]
